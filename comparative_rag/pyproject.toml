[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "comparative_rag"
version = "0.1.0"
description = "RAG system."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "chromadb==1.5.9",
    "pdfplumber==0.11.10",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2"
]

[tool.setuptools.packages.find]
where = ["src"]