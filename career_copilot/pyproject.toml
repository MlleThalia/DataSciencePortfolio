[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "career_copilot"
version = "0.1.0"
description = "AI-powered job search assistant."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "Jinja2==3.1.6",
    "pdfplumber==0.11.10",
    "playwright==1.61.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]